version = 1

# Live Daily Signals receiver (Bun/TypeScript).
# Pipeline: Live Daily Signals HTML -> parsed signal changes -> DuckDB
#   -> Telegram MarkdownV2 alerts
#   + Biquote OHLC -> DuckDB price_candles (for local backtests)
#
# Apply with:   oxmgr apply ./oxfile.toml   (from this directory)
# Follow logs:  oxmgr logs daily-signals -f
# Initial price history (run once): bun run prices:once
#
# Secrets stay in .env (gitignored): BOT_TOKEN, CHAT_ID and the data API keys.

[[apps]]
name = "daily-signals"
## Bun may live in /usr/bin (local) or ~/.bun/bin (VPS), so resolve it through
## one wrapper instead of hardcoding a machine-specific path.
command = "/bin/sh ./scripts/bun.sh run src/main.ts"
cwd = "/home/mdev/Programming/daily_signals"
restart_policy = "always"
max_restarts = 100
## A persistent config error (missing .env keys, bad database path, etc.) must
## enter the error state instead of hot-looping forever.
crash_restart_limit = 5
restart_delay_secs = 10
stop_signal = "SIGTERM"
## Graceful shutdown waits for the in-flight Biquote price pass to finish
## before closing DuckDB, so allow enough time for one collection cycle.
stop_timeout_secs = 120
## The signal loop logs every cycle (60s by default), so a log file older than
## 5 minutes means the process is wedged. A missing file is a fresh boot.
health_cmd = "/bin/sh -c 'test ! -f /home/mdev/.local/share/oxmgr/logs/daily-signals.log || test -n \"$(find /home/mdev/.local/share/oxmgr/logs/daily-signals.log -mmin -5 2>/dev/null)\"'"
health_interval_secs = 60
health_timeout_secs = 5
health_max_failures = 3
## Dependencies must resolve before a reload cuts over; a failed sync aborts
## the reload and leaves the old process running.
pre_reload_cmd = "/bin/sh -c 'cd /home/mdev/Programming/daily_signals && ./scripts/bun.sh install --frozen-lockfile'"
unified_logs = true

[apps.env]
PATH = "/home/mdev/.bun/bin:/home/mdev/.local/bin:/usr/local/bin:/usr/bin:/bin"
HOME = "/home/mdev"
